services:
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-1234567890}
      - POSTGRES_DB=rrb_prep
    ports:
      # Matches backend/.env DATABASE_URL (...@localhost:5544/rrb_prep)
      - '5544:5432'
    volumes:
      - rrb_pg:/var/lib/postgresql

volumes:
  rrb_pg:
